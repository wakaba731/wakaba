<div class="section">
  <h2>珈琲豆の種類</h2>

  <div class="cards">
    <div class="card">
      <h3>アラビカ種</h3>
      <p>
        世界の約60〜70%を占める高品質豆。<br>
        香りが高く、酸味と甘みのバランスが良い。
      </p>
    </div>

    <div class="card">
      <h3>ロブスタ種</h3>
      <p>
       苦味が強くカフェインが多い品種。<br>
      エスプレッソに使われることが多いです。
     </p>
    </div>

  </div>
</div>

<div class="section">
  <h2>焙煎度合い</h2>

  <div class="cards">
    <div class="card">
      <h3>浅煎り</h3>
      <p>酸味が強くフルーティー</p>
    </div>

    <div class="card">
      <h3>中煎り</h3>
      <p>バランスが良く飲みやすい</p>
    </div>

    <div class="card">
      <h3>深煎り</h3>
      <p>苦味とコクが強い</p>
    </div>

  </div>
</div>

<div class="section">
  <h2>人気の珈琲メニュー</h2>

  <div class="cards">
    <div class="card">
      <h3>エスプレッソ</h3>
      <p>濃厚なコーヒー</p>
    </div>

    <div class="card">
      <h3>カフェラテ</h3>
      <p>ミルクたっぷり</p>
    </div>

    <div class="card">
      <h3>カプチーノ</h3>
      <p>泡が特徴</p>
    </div>
  </div>
</div>
